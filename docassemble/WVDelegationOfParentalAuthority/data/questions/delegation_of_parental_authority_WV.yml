  - label: "${ designee[0].name.first }'s  work phone number"
    field: designee1_work_phone
    required: False
---
id: question_1789834170205
question: "What should ${ designee[0].name.first } be able to do? "
subquestion: |2
  If you want ${ designee[0].name.first } to do most things for your ${ children.as_noun('child') } that you do today, select **General Powers**. If you would like to choose exactly what you want ${ designee[0].name.first } to be able to do for your ${ children.as_noun('child') }, select **Only the powers I list** and write them in the box below.
  
  **If you pick general powers, ${ designee[0].name.first } can do the following things for your ${ children.as_noun('child') }:**
  
  * Deal with your ${ children.as_noun('child') }'s school, including enrolling them, giving permission for activities, and attending events
  * Decide what medical and dental care your ${ children.as_noun('child') } should have 
  * Decide what things they can do, like you do now
  
  **${ designee[0].name.first } cannot:**
  
  * Let your ${ children.as_noun('child') } be adopted or get married
  * Let your ${ children.as_noun('child') } get an abortion
  * End the rights you have as a parent
fields:
  - Choose one: delegate_all_powers
    datatype: radio
    choices:
      - {"General Powers":true}
      - {"Only the powers I list":false}
  - label: "What do you want ${ designee[0].name.first } to be able to do?"
    field: user1_designated_powers
    datatype: area
    show if:
      variable: delegate_all_powers
      is: False
---
id: Power of Attorney Duration
question: "When can ${ designee[0].name.first } start and stop making choices for your ${ children.as_noun('child') }?"
subquestion: |2
  If you pick **Immediately**, it starts today. If you want it to start later, choose the month and day.
  
  ${ designee[0].name.first }'s power can last up to 1 year from the start date. For example, if it starts on February 1, it can end as late as January 31 of the next year.
fields:
  - Start: poa_start_type
    datatype: radio
    choices:
      - {"Immediately (today, ${ today().format('MMMM d') })":"immediately"}
      - {"On a future date I choose":"future"}
  - label: Start month
    field: poa_future_start_month
    datatype: dropdown
    code: "poa_month_choices"
    show if: {"is":"future","variable":"poa_start_type"}
  - label: Start day
    field: poa_future_start_day
    datatype: integer
    show if: {"is":"future","variable":"poa_start_type"}
    min: 1
    max: 31
  - label: End month
    field: power_end_month
    datatype: dropdown
    code: "poa_month_choices"
  - label: End day
    field: power_end_day
    datatype: integer
    min: 1
    max: 31
validation code: |
  if poa_start_type == 'future' and poa_future_start_day > poa_days_in_month[poa_future_start_month]:
    validation_error(poa_future_start_month + ' only has ' + str(poa_days_in_month[poa_future_start_month]) + ' days.', field='poa_future_start_day')
  if power_end_day > poa_days_in_month[power_end_month]:
    validation_error(power_end_month + ' only has ' + str(poa_days_in_month[power_end_month]) + ' days.', field='power_end_day')
  if poa_start_type == 'immediately':
    poa_check_start_month = today().format('MMMM')
    poa_check_start_day = today().day
  else:
    poa_check_start_month = poa_future_start_month
    poa_check_start_day = poa_future_start_day
  if power_end_month == poa_check_start_month and power_end_day == poa_check_start_day:
    validation_error("The end date can't be the same as the start date. That would be longer than 1 year. Pick the day before, or earlier.", field='power_end_day')
---
comment: |
  Month names and the most days each month can have (February allows 29 for leap years).
code: |
  poa_days_in_month = {
    'January': 31, 'February': 29, 'March': 31, 'April': 30,
    'May': 31, 'June': 30, 'July': 31, 'August': 31,
    'September': 30, 'October': 31, 'November': 30, 'December': 31,
  }
  poa_month_choices = list(poa_days_in_month.keys())
---
comment: |
  If the delegation is immediately effective, the start date is today.
  Otherwise it is the future month and day the user chose.
code: |
  if poa_start_type == 'immediately':
    power_start_month = today().format('MMMM')
    power_start_day = today().day
  else:
    power_start_month = poa_future_start_month
    power_start_day = poa_future_start_day
