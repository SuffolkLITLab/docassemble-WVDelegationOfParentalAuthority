---
id: background_information
continue button field: wvcode4984withfields_intro
question: "About this form"
subquestion: |2
  ### What does this form do?
  This form lets you pick another adult, as a caregiver, to take care of your child for up to 1 year. The caregiver can make choices about your child's school and health care. You are still the parent, and you can cancel this at any time.
  
  ### Before you start
  Have this information ready:
  
  - Your child's full name and birthday
  - The caregiver's full name, address, and phone numbers
  - The dates you want this to start and end
  
  ### When you are done
  - Check your answers and print the form.
  - You and the caregiver must sign it in front of a notary.
  - Give the caregiver a copy. Keep a copy for yourself.
---
id: Designee Information
question: "Caregiver address and phone number"
subquestion: |
  Provide details about the caregiver.
fields:
  - label: Street address
    field: "designee[0].address.address"
    address autocomplete: true
  - label: Unit
    field: "designee[0].address.unit"
    required: False
  - City: designee[0].address.city
  - label: State
    field: "designee[0].address.state"
    code: "states_list(country_code=AL_DEFAULT_COUNTRY)"
    default: "${ AL_DEFAULT_STATE }"
  - Zip code: designee[0].address.zip
  - Caregiver home phone number: designee1_home_phone
  - label: Caregiver one work phone number
    field: designee1_work_phone
    required: False
---
id: question_1789834170205
question: "What do you want the caregiver to be able to do? "
subquestion: |2
  If you pick Yes, the caregiver will be able to do everything below. If you pick No, write in what you want the caregiver to be able to do.
  
  The caregiver can do the following things for your child(ren):

  * Sign them up for school
  * Get records from their school or other records 
  * Go to school events for them
  * Give permission for them to go to school events 
  * Decide what medical and dental care they should have 
  * Decide what other things they can or cannot do
  
  The caregiver cannot:

  * Let the child be adopted or get married
  * Let the child get an abortion
  * End the rights you have as a parent
fields:
  - Let the caretaker do listed things: delegate_all_powers
    datatype: yesnoradio
---
id: Delegated Powers
question: "What should the caregiver be able to do for your child(ren)? "
subquestion: "Pick what you want the caregiver to be able to do"
fields:
  - User one designated powers granted: user1_designated_powers
    datatype: multiselect
    choices:
      - Sign them up for school
      - Get records from their school or other records
      - Go to school events for them
      - Give permission for them to go to school events
      - Decide what medical and dental care they should have
      - Decide what other things they can or cannot do
---
id: Power of Attorney Duration
question: "When can the caregiver start and stop making choices for your child?"
subquestion: |2
  If the start is immediately, today's date will be used as the start date. If you want it to begin later, choose the month and day it
  should start. You can give the caregiver this power for 1 year or less.
fields:
  - "When should the caregiver start and stop making choices for your child? ": poa_start_type
    datatype: radio
    choices:
      - {"Immediately (today, ${ today().format('MMMM d') })":"immediately"}
      - {"On a future date I choose":"future"}
  - label: Start month
    field: poa_future_start_month
    datatype: dropdown
    code: "poa_month_choices"
    show if: {"is":"future","variable":"poa_start_type"}
  - label: Start day
    field: poa_future_start_day
    datatype: integer
    show if: {"is":"future","variable":"poa_start_type"}
    min: 1
    max: 31
  - label: End month
    field: power_end_month
    datatype: dropdown
    code: "poa_month_choices"
  - label: End day
    field: power_end_day
    datatype: integer
    min: 1
    max: 31
validation code: |
  if poa_start_type == 'future' and poa_future_start_day > poa_days_in_month[poa_future_start_month]:
    validation_error(poa_future_start_month + ' only has ' + str(poa_days_in_month[poa_future_start_month]) + ' days.', field='poa_future_start_day')
  if power_end_day > poa_days_in_month[power_end_month]:
    validation_error(power_end_month + ' only has ' + str(poa_days_in_month[power_end_month]) + ' days.', field='power_end_day')
---
comment: |
  Month names and the most days each month can have (February allows 29 for leap years).
code: |
  poa_days_in_month = {
    'January': 31, 'February': 29, 'March': 31, 'April': 30,
    'May': 31, 'June': 30, 'July': 31, 'August': 31,
    'September': 30, 'October': 31, 'November': 30, 'December': 31,
  }
  poa_month_choices = list(poa_days_in_month.keys())
---
comment: |
  If the delegation is immediately effective, the start date is today.
  Otherwise it is the future month and day the user chose.
code: |
  if poa_start_type == 'immediately':
    power_start_month = today().format('MMMM')
    power_start_day = today().day
  else:
    power_start_month = poa_future_start_month
    power_start_day = poa_future_start_day
