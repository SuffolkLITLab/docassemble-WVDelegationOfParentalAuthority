template: find_a_notary_help
subject: |
  How do I find a notary?
content: |2
  A notary is a person who watches you sign and verifies you are who you say you are. You and the caregiver must both sign this form in front of a notary.
  
  You can find a notary:
  
  * At most banks and credit unions. It is often free if you have an account there.
  * At some shipping stores, libraries, and law offices.
  * By using the [West Virginia notary search](https://apps.sos.wv.gov/business/notary). Pick your county to see notaries near you.
  
  **Before you go:**
  
  * Call ahead to make sure a notary will be there.
  * Bring a photo ID, such as a license or a passport. The caregiver needs to bring one too.
  * If you do not have one of these documents, you can bring a witness to swear you are who you say you are. The witness cannot be the caregiver.
  * Do not sign the form until you are in front of the notary.
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: wv_delegation_next_steps
  docx template file: wv_delegation_next_steps.docx
  variable name: wvcode4984withfields_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: wvcode4984withfields
  filename: wv_delegation_of_parental_authority
  variable name: wvcode4984withfields_attachment[i]
  skip undefined: True
  pdf template file: wv_delegation_of_parental_authority.pdf
  fields:
      - "user1_name": ${ users[0] }
      - "user1_name__1": ${ users[0] }
      - "children1_name": ${ children[0] }
      - "children1_birthdate": ${ children[0].birthdate.format() }
      - "children2_birthdate": ${ children[1].birthdate.format() }
      - "children2_name": ${ children[1] }
      - "children3_birthdate": ${ "" if children_need_addendum else children[2].birthdate.format() }
      - "children3_name": ${ "See addendum" if children_need_addendum else children[2] }
      - "designee1_name": ${ designee[0] }
      - "designee1_name__1": ${ designee[0] }
      - "designee1_address": ${ designee[0].address.on_one_line() }
      - "designee1_home_phone": ${ designee1_home_phone }
      - "designee1_work_phone": ${ designee1_work_phone }
      - "user1_designated_powers": ${ "" if delegate_all_powers else comma_and_list(user1_designated_powers) }
      - "power_start_month": ${ power_start_month }
      - "power_end_month": ${ power_end_month }
      - "power_end_day": ${ power_end_day }
      - "power_start_day": ${ power_start_day }
