---
id: background_information
continue button field: wvcode4984withfields_intro
question: "Let someone look after your kids"
subquestion: |2
  ### What does this form do?
  This form lets you pick another adult (the “caregiver”) to look after  child(ren) for up to one year. The caregiver can make choices about your child's school and health care. You are still the parent, and you can cancel this at any time.
  
  ### Who can use this form?
  You can use this form if: 
  
  - You are a parent, guardian, or legal custodian of one or more child(ren) under the age of 18.
  - Your children live in West Virginia.
  - You wish to pick someone to take care of your kids if you cannot.
  - A qualified nonprofit organization is helping you set this up.
  
  ${ collapse_template(what_is_qualified_nonprofit) }
    
  ### Before you start
  Have this information ready:
  
  - Your child(ren)'s full name(s) and birthday(s).
  - The caregiver's full name, address, and phone numbers.
  - The dates you want this power to start and end.
  
  ### When you are done with this tool
  
  - Check your answers and print the form.
  - You and the caregiver must sign it in front of a notary.
  - Give the caregiver a copy. Keep a copy for yourself.
  - This form does not get filed with a court.
---
template: what_is_qualified_nonprofit
subject: |
  What is a qualified nonprofit organization?
content: |2
  West Virginia's law for this form is for parents who get help from a **qualified nonprofit organization**. That is a charitable or religious group that:
  
  * Is a 501(c)(3) tax-exempt organization, **and**
  * Helps parents arrange temporary care for their children with this kind of form
  
  Before you sign, the nonprofit checks the background of the person who will care for your children and trains them.
---
id: nonprofit gate
question: |
  Is a nonprofit helping you set this up?
subquestion: |2
  This form is for parents who are working with a **qualified nonprofit organization**. That is a charitable or religious group that is a 501(c)(3) tax-exempt organization and helps parents arrange temporary care for their children.
  
  ${ collapse_template(how_to_tell_nonprofit) }
fields:
  - no label: nonprofit_status
    datatype: radio
    choices:
      - Yes, a nonprofit is helping me: "yes"
      - "No": "no"
      - I'm not sure: unsure
  - What is the nonprofit's name?: nonprofit_name
    show if:
      variable: nonprofit_status
      is: "yes"
    required: False
---
template: how_to_tell_nonprofit
subject: |
  How do I know if the group helping me counts?
content: |2
  Ask the organization:
  
  1. Are you a 501(c)(3) nonprofit?
  2. Will you do a background check on the person who will care for my children, and train them, before I sign?
  
  If the answer to both is yes, it most likely counts.
---
id: no nonprofit exit
event: no_nonprofit_exit
question: |
  % if nonprofit_status == "unsure":
  Check with the group helping you first
  % else:
  This form is for families working with a nonprofit
  % endif
subquestion: |2
  % if nonprofit_status == "unsure":
  Ask the organization if it is a 501(c)(3) nonprofit and if it will do a background check and training for the person who will care for your children. If it will, come back and start again.
  % else:
  West Virginia's law for this form only covers parents who get help from a qualified nonprofit. Without one, this form may not do what you need.
  % endif
  
  **Is the person who will care for your children a relative?** Legal Aid of West Virginia's [Kinship Connector](https://legalaidwv.org/kinship-connector/) can help you make a temporary care agreement with a relative, like a grandparent, aunt or uncle. You do not need a nonprofit to use it.
  
  For other ways to arrange care for your children, contact [Legal Aid of West Virginia](https://legalaidwv.org) or talk to a lawyer.
buttons:
  - Start over: restart
  - Exit: exit
---
id: nonprofit before signing
continue button field: nonprofit_before_signing
question: |
  What ${ nonprofit_name if nonprofit_name else "the nonprofit" } does before you sign
subquestion: |2
  Before you sign this form, ${ nonprofit_name if nonprofit_name else "the nonprofit" } has to:
  
  * Do a background check on ${ designee[0].name.first }
  * Train ${ designee[0].name.first } on how to care for your children under this form, including how to spot and report abuse or neglect
  
  After you sign, give ${ nonprofit_name if nonprofit_name else "the nonprofit" } a copy. They have to keep it.
