id: background_information
continue button field: wvcode4984withfieldswithfields_intro
question: West Virginia Delegation of Parental Authority Form Background
subquestion: |
  ### Before you get started
  - Gather the necessary information about yourself, the child, and the designee.
  - Ensure you understand the powers you are delegating and any limitations.

  ### When you are finished
  - Sign the form in the presence of a notary public.
  - Provide a copy of the signed form to the designee and keep a copy for your records.

  You can use this form if you are a parent or legal custodian looking to temporarily delegate your parental rights to someone else. It's important to understand the limitations of the powers you are granting.
---
id: Designee Information
question: |
  Designee Information
subquestion: |
  Provide details about the designee.
fields:
  - "Designee one address details": designee1_address
  - "Designee one home phone number": designee1_home_phone
  - "Designee one work phone number": designee1_work_phone
---
id: question_1789834170205
question: Will you delegate all powers to the designee?
subquestion: |
  Choose Yes to delegate all powers. If you select No, please specify which powers you want to delegate on the next screen. If you choose to delegate all powers, the powers included in that will be as follows 
  All of my power and authority regarding the care, custody and property of each minor child named above, including but not limited to 
  *The right to enroll the child in school
  *The right to inspect and obtain copies of education records and other records concerning the child
  *The right to attend school activities and other functions concerning the child
  *The right to give or withhold any consent or waiver with respect to school activities, 
  *The right to give or withhold any consent or waiver with respect to medical and dental treatment
  *The right to give or withhold any consent or waiver with respect to any other activity, function or treatment that may concern the child. 
  What this does **Not Include* 
  *The power or authority to consent to marriage or adoption of the child
  *The performance or inducement of an abortion on or for the child,
  *The termination of parental rights to the child
fields:
  - Delegate all powers to the designee: delegate_all_powers
    datatype: yesnoradio
---
id: Delegated Powers
question: |
  Delegated Powers
subquestion: Select the powers you are granting to the designee.
fields:
  - User one designated powers granted: user1_designated_powers
    datatype: multiselect
    choices:
      - The right to enroll the child in school
      - The right to inspect and obtain copies of education records and other records concerning the child
      - The right to attend school activities and other functions concerning the child
      - "The right to give or withhold any consent or waiver with respect to school activities,"
      - The right to give or withhold any consent or waiver with respect to medical and dental treatment
      - "The right to give or withhold any consent or waiver with respect to any other activity, function or treatment that may concern the child."
---
id: Power of Attorney Duration
question: |
