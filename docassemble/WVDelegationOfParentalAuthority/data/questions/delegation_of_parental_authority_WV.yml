subquestion: |
  Indicate the start and end dates for the power of attorney.
fields:
  - "Power of attorney start month": power_start_month
  - "Power of attorney start day": power_start_day
  - "Power of attorney end month": power_end_month
  - "Power of attorney end day": power_end_day
---
id: Signature Information
