metadata:
  title: >-
    WVCode-§49-8-4-with-fields-with-fields
  short title: >-
    WVCode-§49-8-4-with-field
  description: |-
    This form allows a parent or legal custodian to delegate their rights regarding the care and custody of a minor child to another individual. It ensures that the designee has the authority to make decisions about the child's education and medical care.
  can_I_use_this_form: |
    You can use this form if you are a parent or legal custodian looking to temporarily delegate your parental rights to someone else. It's important to understand the limitations of the powers you are granting.
  before_you_start: |
    ### Before you get started
    - Gather the necessary information about yourself, the child, and the designee.
    - Ensure you understand the powers you are delegating and any limitations.

    ### When you are finished
    - Sign the form in the presence of a notary public.
    - Provide a copy of the signed form to the designee and keep a copy for your records.
  when_you_are_finished: |
    After completing the form, ensure it is signed and notarized. You should provide copies to the designee and keep one for yourself. This will help in case you need to reference the delegated powers in the future.
